# Build the documentation site and publish it to GitHub Pages.
#
# The site under site/ renders the skills under skills/ at build time, so a
# change to either rebuilds it. The build fails on any broken internal link
# (starlight-links-validator), which is the gate between "pushed" and "live".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "skills/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build (syncs skills/, builds, validates every internal link)
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
